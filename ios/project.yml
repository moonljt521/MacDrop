name: MoonDropMobile

options:
  bundleIdPrefix: com.macdrop
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"

targets:
  MoonDropMobile:
    type: application
    platform: iOS
    sources:
      - path: MoonDrop
        excludes:
          - Info.plist
    entitlements:
      path: MoonDrop/MoonDrop.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.macdrop.mobile
    dependencies:
      - target: MoonDropShare
        embed: true
    settings:
      base:
        PRODUCT_NAME: MoonDrop
        PRODUCT_BUNDLE_IDENTIFIER: com.macdrop.mobile
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MoonDrop/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 75L84BV98K

  MoonDropShare:
    type: app-extension
    platform: iOS
    sources:
      - path: MoonDropShare
        excludes:
          - Info.plist
    entitlements:
      path: MoonDropShare/MoonDropShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.macdrop.mobile
    settings:
      base:
        PRODUCT_NAME: MoonDropShare
        PRODUCT_BUNDLE_IDENTIFIER: com.macdrop.mobile.share
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MoonDropShare/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 75L84BV98K
